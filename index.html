    <!-- WebSite + SearchAction — enables Google Sitelinks Search Box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "url": "https://www.dojapa.com",

        "@type": "SearchAction",

          "@type": "EntryPoint",

        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- MobileApplication — powers app rich cards in Google Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "DoJapa — Digital Mala & Japa Counter",
      "operatingSystem": ["ANDROID", "IOS", "WEB"],
      "applicationCategory": "LifestyleApplication",

      "description": "A digital mala counter and mantra japa tracker for devotees. Count 108-bead rounds, choose from Hare Krishna, Gayatri, Om Namah Shivaya, Ram Naam, Om Mani Padme Hum, and more.",

        "108-bead digital mala counter",
        "Hare Krishna Maha Mantra",

        "Sadhana journal"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },

    <!-- FAQPage — renders expandable FAQ rich results in Google SERP -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is japa meditation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Japa (Sanskrit: जप) is the meditative repetition of a divine name or mantra. Practiced across Hindu, Buddhist, Jain, and Sikh traditions, it is considered one of the most accessible and powerful forms of spiritual discipline. A traditional japa session counts rounds on a mala of 108 beads."
          }
        },
        {
          "@type": "Question",
          "name": "How many rounds of japa should I do daily?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most traditions recommend starting with 1–4 rounds (108–432 mantras) per day and gradually increasing. In the Gaudiya Vaishnava tradition, initiated devotees chant a minimum of 16 rounds (1,728 Hare Krishna mahas) daily. For beginners, even one focused round with full attention is deeply beneficial."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use a digital mala instead of tulsi beads?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. A digital mala like DoJapa tracks your count with the same accuracy as physical beads. Traditionalists recommend physical tulsi or rudraksha beads for the tactile, meditative quality they add. A digital mala is ideal for travel, accessibility, or when your physical mala is not at hand."
          }
        },
        {
          "@type": "Question",
          "name": "Which mantra is best for beginners?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Hare Krishna Maha Mantra, Ram Naam, and Om Namah Shivaya are widely recommended for beginners due to their simplicity, universality, and the depth of tradition supporting them. The best mantra is often the one your heart responds to most naturally, or one given by a qualified teacher."
          }
        },
        {
          "@type": "Question",
          "name": "What is the significance of 108 beads on a mala?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "108 is sacred across Hinduism, Buddhism, and Jainism. The sun's diameter is approximately 108 times that of Earth. There are 108 Upanishads and 108 names of major deities. Mathematically, 108 = 1^1 × 2^2 × 3^3, which ancient scholars found cosmically significant. One full mala (108 repetitions) represents a complete cycle."
          }
        },
        {
          "@type": "Question",
          "name": "Is it okay to do japa without initiation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Public mantras such as the Hare Krishna Maha Mantra, Om Namah Shivaya, Gayatri, and Ram Naam can be chanted by anyone sincerely seeking spiritual growth. Initiation intensifies the power of a mantra by connecting the practitioner to a living lineage, but it is not a prerequisite for beginning japa practice."
          }
        }
      ]
    }
    </script>
